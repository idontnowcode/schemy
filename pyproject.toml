[project]
name = "ai-circuit-studio"
version = "0.1.0"
description = "AI Circuit Studio - Circuit IR, KiCad generation and local API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openpyxl>=3.1,<4",
    "keyring>=25,<26",
    "google-genai>=2.30,<3",
    "pypdf>=6",
    "anthropic>=1,<2",
    "httpx>=0.27,<1",
    "cryptography>=42",
]

[project.scripts]
aics = "kicad_adapter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
]
packaging = [
    "pyinstaller>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["ai_engine/prompts/*.txt"]
packages = ["circuit_core", "kicad_adapter", "backend", "ai_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "kicad: needs kicad-cli (native install or Docker image); skipped when unavailable",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# User-facing Korean messages are kept on one line so they stay searchable.
"circuit_core/schematic_md.py" = ["E501"]
"circuit_core/datasheet_md.py" = ["E501"]
"backend/datasheets.py" = ["E501"]
"backend/routes_datasheets.py" = ["E501"]
"backend/proposals.py" = ["E501"]
"backend/ai_access.py" = ["E501"]
"backend/routes_design.py" = ["E501"]
"backend/design_resolver.py" = ["E501"]
"ai_engine/*.py" = ["E501"]
"backend/routes_ai.py" = ["E501"]
"backend/claude_login.py" = ["E501"]
"backend/routes_layout.py" = ["E501"]
"circuit_core/engineering.py" = ["E501"]
"circuit_core/rationale.py" = ["E501"]
"backend/routes_templates.py" = ["E501"]
"backend/reviews.py" = ["E501"]
"backend/agent/*.py" = ["E501"]
"circuit_core/templates.py" = ["E501"]
"tests/test_schematic_md.py" = ["E501"]
"tests/test_design.py" = ["E501"]
"tests/test_ai_claude.py" = ["E501"]
"tests/test_reviews.py" = ["E501"]
"tests/test_agent.py" = ["E501"]
"tests/e2e_backend.py" = ["E501"]
