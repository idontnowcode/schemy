[project]
name = "ai-circuit-studio"
version = "0.0.1"
description = "AI Circuit Studio - Phase 0 PoC: Circuit IR to KiCad schematic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
aics = "kicad_adapter.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circuit_core", "kicad_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "kicad: needs kicad-cli (native install or Docker image); skipped when unavailable",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
